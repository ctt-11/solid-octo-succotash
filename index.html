<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手骨骼粒子游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
        #video {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 100;
        }
        #ui h1 {
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        #ui .info {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        #ui .gesture {
            font-size: 18px;
            color: #00ffff;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }
        #ui .particle-count {
            font-size: 14px;
            margin-top: 10px;
            opacity: 0.6;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            z-index: 100;
        }
        .control-group {
            margin-bottom: 10px;
        }
        .control-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            opacity: 0.8;
        }
        .control-group input[type="range"] {
            width: 200px;
        }
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .mode-btn {
            padding: 8px 16px;
            border: 2px solid rgba(0, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .mode-btn:hover {
            border-color: rgba(0, 255, 255, 0.6);
        }
        .mode-btn.active {
            border-color: #00ffff;
            background: rgba(0, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <video id="video" autoplay playsinline></video>
    <div id="ui">
        <h1>手骨骼粒子游戏</h1>
        <div class="info">将手放在摄像头前</div>
        <div class="gesture" id="gesture-display">等待手部检测...</div>
        <div class="particle-count" id="particle-count">粒子数: 0</div>
    </div>
    <div id="controls">
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="fire">火焰</button>
            <button class="mode-btn" data-mode="water">水流</button>
            <button class="mode-btn" data-mode="snow">雪花</button>
            <button class="mode-btn" data-mode="galaxy">银河</button>
        </div>
        <div class="control-group">
            <label>粒子大小: <span id="particle-size-value">3</span></label>
            <input type="range" id="particle-size" min="1" max="10" value="3">
        </div>
        <div class="control-group">
            <label>粒子数量: <span id="particle-count-value">500</span></label>
            <input type="range" id="particle-count-slider" min="100" max="2000" value="500">
        </div>
        <div class="control-group">
            <label>粒子速度: <span id="speed-value">1</span></label>
            <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1">
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="js/particleSystem.js"></script>
    <script src="js/handTracker.js"></script>
    <script src="js/gestureRecognizer.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
